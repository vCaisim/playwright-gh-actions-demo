name: run-comment

# Reproduces tests that time out with no step recording an error, for the "Last
# Steps" section of the run-level AI context, and posts a run comment with the
# small footer. One job, one project, about 10 seconds of tests.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CURRENTS_CI_BUILD_ID: run-comment-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
      CURRENTS_PROJECT_ID: ${{ vars.CURRENTS_PROJECT_ID != '' && secrets.CURRENTS_RECORD_KEY != '' && vars.CURRENTS_PROJECT_ID || 'mdXsz8' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Only append to GITHUB_ENV when non-empty (empty CURRENTS_API_URL would break ?? fallbacks in Node).
      - name: Optional Currents API URL and record key
        env:
          CURRENTS_API_URL_INPUT: ${{ vars.CURRENTS_API_URL || secrets.CURRENTS_API_URL }}
          CURRENTS_RECORD_KEY_INPUT: ${{ secrets.CURRENTS_RECORD_KEY }}
        run: |
          if [ -n "$CURRENTS_API_URL_INPUT" ]; then
            echo "CURRENTS_API_URL=$CURRENTS_API_URL_INPUT" >> "$GITHUB_ENV"
          fi
          if [ -n "$CURRENTS_RECORD_KEY_INPUT" ]; then
            {
              echo "CURRENTS_RECORD_KEY<<CURR_EOF"
              printf '%s\n' "$CURRENTS_RECORD_KEY_INPUT"
              echo "CURR_EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Playwright Tests
        run: npx playwright test --config run-comment/playwright.config.ts
