name: run-comment-race

# Reproduces the concurrent run comment deliveries that ENG-1421 is about.
# Pick a scenario by putting [a] or [c] in the commit subject, or run the
# workflow by hand. Without a marker the commit runs scenario B, the only one
# that reproduces the stale comment.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: Which scenario to run
        type: choice
        default: b
        options: [b, a, c]

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      scenario: ${{ steps.pick.outputs.scenario }}
      dir: ${{ steps.pick.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - id: pick
        env:
          DISPATCH_SCENARIO: ${{ github.event.inputs.scenario }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_SCENARIO:-}" ]; then
            scenario="$DISPATCH_SCENARIO"
          else
            subject=$(git log -1 --pretty=%s)
            echo "commit subject: $subject"
            # B is the default: it is the one that shows the bug. A and C have
            # to be asked for.
            case "$subject" in
              *\[a\]*) scenario=a ;;
              *\[c\]*) scenario=c ;;
              *)       scenario=b ;;
            esac
          fi

          case "$scenario" in
            a) dir=scenario-a-parallel-groups ;;
            b) dir=scenario-b-racing-runs ;;
            c) dir=scenario-c-control ;;
          esac

          echo "scenario: $scenario ($dir)"
          echo "scenario=$scenario" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

  race:
    needs: pick
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-jammy
    env:
      CURRENTS_CI_BUILD_ID: race-${{ github.run_id }}-${{ github.run_attempt }}
      CURRENTS_PROJECT_ID: ${{ vars.CURRENTS_PROJECT_ID != '' && secrets.CURRENTS_RECORD_KEY != '' && vars.CURRENTS_PROJECT_ID || 'mdXsz8' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # https://github.com/actions/runner-images/issues/6775
      - run: |
          echo "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # No browser install: these specs never open a page, so the run is about
      # delivery timing and nothing else.
      - name: Install dependencies
        run: npm ci

      - name: Optional Currents API URL and record key
        env:
          CURRENTS_API_URL_INPUT: ${{ vars.CURRENTS_API_URL || secrets.CURRENTS_API_URL }}
          CURRENTS_RECORD_KEY_INPUT: ${{ secrets.CURRENTS_RECORD_KEY }}
        run: |
          if [ -n "$CURRENTS_API_URL_INPUT" ]; then
            echo "CURRENTS_API_URL=$CURRENTS_API_URL_INPUT" >> "$GITHUB_ENV"
          fi
          if [ -n "$CURRENTS_RECORD_KEY_INPUT" ]; then
            {
              echo "CURRENTS_RECORD_KEY<<CURR_EOF"
              printf '%s\n' "$CURRENTS_RECORD_KEY_INPUT"
              echo "CURR_EOF"
            } >> "$GITHUB_ENV"
          fi

      # Scenario B starts RUNS runs at the same instant.
      #
      # Simultaneous, not staggered. Ownership of the comment is decided by
      # runStartedAt, which the server assigns as each run is created. Any
      # stagger makes the runs start in a known order AND makes their deliveries
      # write in that same order, so the newest always writes last and
      # canWriteOverComment simply answers correctly. Simulated over 2000 trials
      # at this stack's ~50ms delivery jitter: a 200ms stagger never produces a
      # wrong owner, 50ms produces one 4% of the time, and 0ms produces one 80%
      # of the time. Launching together is what decouples runStartedAt order from
      # write order.
      #
      # Which run should own the comment is therefore not known in advance — it
      # is whichever the server stamped last. Read that from the five runs' start
      # times in Currents, not from the b1..b5 suffix.
      #
      # Runs on one runner rather than matrix jobs so the launch is simultaneous.
      # Separate --output keeps them off each other's results, under the
      # already-ignored test-results/.
      - name: Run scenario ${{ needs.pick.outputs.scenario }}
        working-directory: ./${{ needs.pick.outputs.dir }}
        env:
          SCENARIO: ${{ needs.pick.outputs.scenario }}
        run: |
          if [ "$SCENARIO" != "b" ]; then
            exec npx pwc
          fi

          RUNS=5
          base="$CURRENTS_CI_BUILD_ID"
          pids=""

          for i in $(seq 1 "$RUNS"); do
            RUN_WORK_MS=3000 CURRENTS_CI_BUILD_ID="${base}-b${i}" \
              npx pwc -- --output="test-results/b${i}" &
            pids="$pids $!"
          done

          # Wait for every run before failing, so one run's failure does not hide
          # what the others did.
          status=0
          for pid in $pids; do
            wait "$pid" || status=$?
          done
          echo "all $RUNS runs finished, worst exit status $status"
          echo "owner is whichever of ${base}-b1..b${RUNS} Currents stamped last"
          exit "$status"
