name: run-comment-race

# Reproduces the concurrent run comment deliveries that ENG-1421 is about.
# Pick a scenario by putting [a] or [c] in the commit subject, or run the
# workflow by hand. Without a marker the commit runs scenario B, the only one
# that reproduces the stale comment.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: Which scenario to run
        type: choice
        default: b
        options: [b, a, c]

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      scenario: ${{ steps.pick.outputs.scenario }}
      dir: ${{ steps.pick.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - id: pick
        env:
          DISPATCH_SCENARIO: ${{ github.event.inputs.scenario }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_SCENARIO:-}" ]; then
            scenario="$DISPATCH_SCENARIO"
          else
            subject=$(git log -1 --pretty=%s)
            echo "commit subject: $subject"
            # B is the default: it is the one that shows the bug. A and C have
            # to be asked for.
            case "$subject" in
              *\[a\]*) scenario=a ;;
              *\[c\]*) scenario=c ;;
              *)       scenario=b ;;
            esac
          fi

          case "$scenario" in
            a) dir=scenario-a-parallel-groups ;;
            b) dir=scenario-b-racing-runs ;;
            c) dir=scenario-c-control ;;
          esac

          echo "scenario: $scenario ($dir)"
          echo "scenario=$scenario" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

  race:
    needs: pick
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-jammy
    env:
      CURRENTS_CI_BUILD_ID: race-${{ github.run_id }}-${{ github.run_attempt }}
      CURRENTS_PROJECT_ID: ${{ vars.CURRENTS_PROJECT_ID != '' && secrets.CURRENTS_RECORD_KEY != '' && vars.CURRENTS_PROJECT_ID || 'mdXsz8' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # https://github.com/actions/runner-images/issues/6775
      - run: |
          echo "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # No browser install: these specs never open a page, so the run is about
      # delivery timing and nothing else.
      - name: Install dependencies
        run: npm ci

      - name: Optional Currents API URL and record key
        env:
          CURRENTS_API_URL_INPUT: ${{ vars.CURRENTS_API_URL || secrets.CURRENTS_API_URL }}
          CURRENTS_RECORD_KEY_INPUT: ${{ secrets.CURRENTS_RECORD_KEY }}
        run: |
          if [ -n "$CURRENTS_API_URL_INPUT" ]; then
            echo "CURRENTS_API_URL=$CURRENTS_API_URL_INPUT" >> "$GITHUB_ENV"
          fi
          if [ -n "$CURRENTS_RECORD_KEY_INPUT" ]; then
            {
              echo "CURRENTS_RECORD_KEY<<CURR_EOF"
              printf '%s\n' "$CURRENTS_RECORD_KEY_INPUT"
              echo "CURR_EOF"
            } >> "$GITHUB_ENV"
          fi

      # Scenario B starts RUNS runs one second apart and has every one of them
      # finish at the same instant.
      #
      # Both halves are load bearing. The offset starts give each run a distinct
      # runStartedAt, so there is exactly one correct owner — the last to start.
      # The shared finish means the deliveries reach the comment together, so
      # nothing about their order reflects which run should win, and the
      # ownership check is the only thing that can pick the winner. Without the
      # lock the last write wins instead, and that is the newest run only 1 time
      # in RUNS.
      #
      # This cannot be done with matrix jobs: each spends a minute or two on
      # checkout and npm ci, those durations vary independently, and the offsets
      # would be whatever CI happened to give. Processes on one runner put the
      # timing under this script's control. Separate --output keeps them off each
      # other's results, under the already-ignored test-results/.
      - name: Run scenario ${{ needs.pick.outputs.scenario }}
        working-directory: ./${{ needs.pick.outputs.dir }}
        env:
          SCENARIO: ${{ needs.pick.outputs.scenario }}
        run: |
          if [ "$SCENARIO" != "b" ]; then
            exec npx pwc
          fi

          RUNS=5
          base="$CURRENTS_CI_BUILD_ID"
          pids=""

          for i in $(seq 1 "$RUNS"); do
            # Run i starts at second i-1 and works for RUNS-i+1 seconds, so every
            # run lands on the same finish.
            work_ms=$(( (RUNS - i + 1) * 1000 ))
            RUN_WORK_MS="$work_ms" CURRENTS_CI_BUILD_ID="${base}-b${i}" \
              npx pwc -- --output="test-results/b${i}" &
            pids="$pids $!"
            [ "$i" -lt "$RUNS" ] && sleep 1
          done

          # Wait for every run before failing, so one run's failure does not hide
          # what the others did. b${RUNS} started last, so it is the run that must
          # own the comment.
          status=0
          for pid in $pids; do
            wait "$pid" || status=$?
          done
          echo "all $RUNS runs finished, worst exit status $status"
          echo "expected owner: ${base}-b${RUNS} (started last)"
          exit "$status"
