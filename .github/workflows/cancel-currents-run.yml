name: cancel-currents-run

# Push, wait until "Playwright tests" is running (basic/9-slow.spec.ts keeps
# each shard busy), then push again. `concurrency` cancels the first run's
# shards, and the cancel step should mark its Currents run as cancelled
# instead of leaving it in progress until the project's inactivity timeout.
on:
  push:
    branches: [test/cancel-currents-run]
  workflow_dispatch:
    inputs:
      slow_seconds:
        description: How long basic/9-slow.spec.ts waits, in seconds
        default: "180"

jobs:
  test:
    name: Playwright tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: cancel-currents-run-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-jammy
    env:
      # The reporter and the cancel step have to name the same run, and
      # `currents cancel` does not derive an id the way the reporter does.
      CURRENTS_CI_BUILD_ID: cancel-demo-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
      CURRENTS_PROJECT_ID: ${{ vars.CURRENTS_PROJECT_ID != '' && secrets.CURRENTS_RECORD_KEY != '' && vars.CURRENTS_PROJECT_ID || 'mdXsz8' }}
      SLOW_SECONDS: ${{ inputs.slow_seconds || '180' }}
    steps:
      - uses: actions/checkout@v4

      # https://github.com/actions/runner-images/issues/6775
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chrome

      # Only append to GITHUB_ENV when non-empty (empty CURRENTS_API_URL would break ?? fallbacks in Node).
      # Both the reporter and `currents cancel` read CURRENTS_API_URL.
      - name: Optional Currents API URL and record key
        env:
          CURRENTS_API_URL_INPUT: ${{ vars.CURRENTS_API_URL || secrets.CURRENTS_API_URL }}
          CURRENTS_RECORD_KEY_INPUT: ${{ secrets.CURRENTS_RECORD_KEY }}
        run: |
          if [ -n "$CURRENTS_API_URL_INPUT" ]; then
            echo "CURRENTS_API_URL=$CURRENTS_API_URL_INPUT" >> "$GITHUB_ENV"
          fi
          if [ -n "$CURRENTS_RECORD_KEY_INPUT" ]; then
            {
              echo "CURRENTS_RECORD_KEY<<CURR_EOF"
              printf '%s\n' "$CURRENTS_RECORD_KEY_INPUT"
              echo "CURR_EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Playwright tests
        working-directory: ./basic
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --config ./playwright.config.reporter.ts

      - name: Cancel the Currents run
        if: ${{ cancelled() }}
        run: npx -y @currents/cmd@1.10.0 cancel
