name: failed-only-reporter

on:
  pull_request:

jobs:
  test-reporter:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-jammy
    env:
      CURRENTS_CI_BUILD_ID: reporter-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
      CURRENTS_PROJECT_ID: ${{ vars.CURRENTS_PROJECT_ID != '' && secrets.CURRENTS_RECORD_KEY != '' && vars.CURRENTS_PROJECT_ID || 'mdXsz8' }}
    steps:
      # PR head (not merge commit) so git message ≠ PR title from ghaEventData.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # https://github.com/actions/runner-images/issues/6775
      - run: |
          echo "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Fixed tip message for title-mode testing (≠ PR title from ghaEventData).
      - name: Set Currents commit info from PR head
        run: |
          {
            echo "COMMIT_INFO_SHA=$(git rev-parse HEAD)"
            echo "COMMIT_INFO_BRANCH=${{ github.head_ref }}"
            echo "COMMIT_INFO_MESSAGE=chore: trigger workflow"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chrome

      # Only append to GITHUB_ENV when non-empty (empty CURRENTS_API_URL would break ?? fallbacks in Node).
      # API URL may be a repo/org variable or a secret (secrets are common for self-hosted / staging URLs).
      - name: Optional Currents API URL and record key
        env:
          CURRENTS_API_URL_INPUT: ${{ vars.CURRENTS_API_URL || secrets.CURRENTS_API_URL }}
          CURRENTS_RECORD_KEY_INPUT: ${{ secrets.CURRENTS_RECORD_KEY }}
        run: |
          if [ -n "$CURRENTS_API_URL_INPUT" ]; then
            echo "CURRENTS_API_URL=$CURRENTS_API_URL_INPUT" >> "$GITHUB_ENV"
          fi
          if [ -n "$CURRENTS_RECORD_KEY_INPUT" ]; then
            {
              echo "CURRENTS_RECORD_KEY<<CURR_EOF"
              printf '%s\n' "$CURRENTS_RECORD_KEY_INPUT"
              echo "CURR_EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Playwright Last Failed action
        id: last-failed-action
        uses: currents-dev/playwright-last-failed@v1
        with:
          # debug: true
          pw-output-dir: basic/test-results
          matrix-index: ${{ matrix.shard }}
          matrix-total: ${{ strategy.job-total }}

      - name: Playwright Tests
        working-directory: ./basic
        run: |
          COMMAND="npx playwright test --config playwright.config.reporter.ts ${{ steps.last-failed-action.outputs.extra-pw-flags }}"
          echo "Running command: $COMMAND"
          $COMMAND
