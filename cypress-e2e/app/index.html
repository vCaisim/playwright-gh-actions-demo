<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Shop</title></head>
  <body>
    <h1 data-cy="title">Shop</h1>
    <form data-cy="login">
      <input data-cy="email" type="email" />
      <input data-cy="password" type="password" />
      <button data-cy="submit" type="button" onclick="document.querySelector('[data-cy=message]').textContent='Invalid password'">Sign in</button>
      <p data-cy="message"></p>
    </form>
    <ul data-cy="cart">
      <li data-cy="item" data-price="12">Mug</li>
      <li data-cy="item" data-price="30">Shirt</li>
    </ul>
    <p data-cy="total">Total: $42</p>
    <input data-cy="search" />
  </body>
</html>
